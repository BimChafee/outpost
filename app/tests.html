<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Outpost tests</title>
<style>body{font:14px/1.5 monospace;padding:16px} .pass{color:#2F6B62} .fail{color:#B4532A;font-weight:bold}</style></head>
<body>
<h1>Outpost logic tests</h1>
<pre id="out"></pre>
<script type="module">
import { splitCents, billShares, billTotal, balances, settleUp } from './js/money.js';
import { upcomingPickups } from './js/schedule.js';
import { parseReceiptText, reconcile } from './js/receipt.js';
import { repeatText, dayTimeLabel, occurrences, packLane, weekStart, weekDays, monthGrid, awayOn, normaliseEvent, fmtTime, fmtTimeShort } from './js/calendar-model.js';
import { rentInfo } from './js/views/house.js';
import { statusOf, applyView, sectionize, orderAfterMove, bumpQty, statusPatch, parseEntry, HISTORY_DAYS } from './js/grocery-model.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const eq = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  out.insertAdjacentHTML('beforeend', `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : `\n   got  ${JSON.stringify(got)}\n   want ${JSON.stringify(want)}`}</span>\n`);
};

// money
eq('splitCents even remainder', splitCents(1000, { a: 1, b: 1, c: 1 }), { a: 334, b: 333, c: 333 });
eq('splitCents weighted', splitCents(1000, { a: 2, b: 1, c: 1 }), { a: 500, b: 250, c: 250 });
eq('splitCents negative', splitCents(-100, { a: 1, b: 1, c: 1 }), { a: -34, b: -33, c: -33 });

const grocery = {
  kind: 'bill', paidBy: 'a', participants: ['a', 'b', 'c'], splitMode: 'items',
  items: [
    { name: 'Steak', price: '20.00', assigned: ['a'] },
    { name: 'Milk', price: '6.00', assigned: [] },           // shared by all
    { name: 'Wine', price: '10.00', assigned: ['b', 'c'] },
  ],
  tax: '3.60', total: '',
};
eq('billTotal from items+tax', billTotal(grocery), 3960);
const sh = billShares(grocery);
// subtotals a=2200 b=700 c=700 ; tax 360 prorated 220/70/70
eq('item shares with prorated tax', sh, { a: 2420, b: 770, c: 770 });
eq('item shares sum to total', Object.values(sh).reduce((s, v) => s + v, 0), 3960);

const rent = { kind: 'bill', paidBy: 'b', participants: ['a', 'b', 'c'], splitMode: 'shares', shares: { a: 1.5, b: 1, c: 1 }, total: '2800' };
eq('shares split', billShares(rent), { a: 120000, b: 80000, c: 80000 });

const bal = balances([grocery, rent, { kind: 'payment', from: 'c', to: 'b', amount: '100' }], ['a', 'b', 'c']);
// grocery: a +3960-2420=+1540, b -770, c -770 ; rent: b +280000-80000=+200000, a -120000, c -80000 ; payment c +10000, b -10000
eq('balances', bal, { a: -118460, b: 189230, c: -70770 });
eq('balances sum to zero', Object.values(bal).reduce((s, v) => s + v, 0), 0);
eq('settleUp', settleUp(bal), [{ from: 'a', to: 'b', amount: 118460 }, { from: 'c', to: 'b', amount: 70770 }]);

// schedule
const bundled = { days: { '2026-11-02': ['organics', 'yardwaste'], '2026-11-09': ['garbage', 'organics', 'yardwaste'], '2026-11-11': ['holiday'] } };
const ups = upcomingPickups(bundled, null, new Date(2026, 9, 28, 9), 4);
eq('next pickup is Nov 2 recycling week', ups[0], { date: '2026-11-02', streams: ['recycling', 'organics', 'yardwaste'], estimated: false });
eq('Nov 9 garbage week', ups[1].streams, ['garbage', 'organics', 'yardwaste']);
eq('extrapolated Nov 16 = recycling', [ups[2].date, ups[2].streams[0], ups[2].estimated], ['2026-11-16', 'recycling', true]);
eq('extrapolated Nov 23 = garbage', [ups[3].date, ups[3].streams[0]], ['2026-11-23', 'garbage']);
const winter = upcomingPickups({ days: {} }, null, new Date(2027, 0, 20), 2);
eq('winter extrapolation has no yard waste', winter.map((p) => p.streams.length), [2, 2]);
const live = { days: { '2026-11-03': ['organics'] } };
eq('live schedule merges in (holiday shift)', upcomingPickups({ days: {} }, live, new Date(2026, 10, 1), 1)[0].date, '2026-11-03');

// receipt parsing
const r = parseReceiptText(`NO FRILLS #3412
2026-10-25 14:02
BANANAS          1.47
2% MILK 4L       6.29 H
CHICKEN THIGHS  12.48
0.875 kg @ $1.68/kg
COUPON          ~1.00
PAPER TOWEL 6PK  9.99 4
SUBTOTAL        29.23
HST 13%          1.30
TOTAL           30.53
DEBIT           30.53
CHANGE           0.00`);
eq('receipt merchant', r.merchant, 'No Frills 3412');
eq('receipt date', r.date, '2026-10-25');
eq('receipt items (misread minus, stray tax flag, weighed line skipped, stops at total)', r.items.map((i) => [i.name, i.price]),
  [['Bananas', 1.47], ['2% milk 4l', 6.29], ['Chicken thighs', 12.48], ['Coupon', -1], ['Paper towel 6pk', 9.99]]);
eq('receipt tax/total', [r.tax, r.subtotal, r.total], [1.3, 29.23, 30.53]);
eq('reconcile ok', reconcile(r).ok, true);
eq('reconcile mismatch', reconcile({ ...r, subtotal: 28.23 }).diff, -100);
const split = parseReceiptText(`EGGS LARGE 12
4.49
TOTAL 4.49`);
eq('price on the next line', split.items.map((i) => [i.name, i.price]), [['Eggs large 12', 4.49]]);
const trailingMinus = parseReceiptText(`STORE CARD SAVINGS DISC 2.00-
STEAK 10.00
TOTAL 8.00`);
eq('trailing minus discount', trailingMinus.items.map((i) => i.price), [-2, 10]);


// groceries
eq('legacy done=true is "later"', [statusOf({ done: true }), statusOf({}), statusOf({ status: 'history', done: true })], ['later', 'active', 'history']);
const G = [
  { id: 'a', name: 'Milk', notes: 'oat', categoryIds: ['dairy'], storeIds: ['nf'], forIds: ['m1'], sortOrder: 3000, createdAt: 1 },
  { id: 'b', name: 'apples', categoryIds: ['produce'], storeIds: ['nf', 'cc'], forIds: [], sortOrder: 1000, createdAt: 3 },
  { id: 'c', name: 'Bleach', categoryIds: [], storeIds: ['cc'], forIds: ['m2'], sortOrder: 2000, createdAt: 2 },
];
eq('manual order', applyView(G, { sort: 'manual' }).map((g) => g.id), ['b', 'c', 'a']);
eq('name order ignores case', applyView(G, { sort: 'name' }).map((g) => g.id), ['b', 'c', 'a']);
eq('recent first', applyView(G, { sort: 'recent' }).map((g) => g.id), ['b', 'c', 'a']);
eq('filter by store (any of)', applyView(G, { sort: 'manual', filters: { store: ['cc'] } }).map((g) => g.id), ['b', 'c']);
eq('filters combine across kinds', applyView(G, { sort: 'manual', filters: { store: ['nf'], category: ['dairy'] } }).map((g) => g.id), ['a']);
eq('search matches notes', applyView(G, { sort: 'manual', search: 'OAT' }).map((g) => g.id), ['a']);
const secs = sectionize(applyView(G, { sort: 'manual' }), 'store', [{ id: 'cc', name: 'Costco' }, { id: 'nf', name: 'No Frills' }]);
eq('multi-store item repeats under each store', secs.map((x) => [x.title, x.items.map((g) => g.id)]), [['Costco', ['b', 'c']], ['No Frills', ['b', 'a']]]);
eq('untagged go to Everything else', sectionize(G, 'category', [{ id: 'dairy', name: 'Dairy' }]).map((x) => x.title), ['Dairy', 'Everything else']);
const ordered = applyView(G, { sort: 'manual' });
eq('drop between two items takes the midpoint', orderAfterMove(ordered, 2, 1), 1500);
eq('drop at top goes before the first', orderAfterMove(ordered, 2, 0), 0);
eq('drop at bottom goes after the last', orderAfterMove(ordered, 0, 2), 4000);
eq('bump quantity', [bumpQty('2', '3'), bumpQty('2 dozen', ''), bumpQty('', ''), bumpQty('a bag', '2')], ['5', '3 dozen', '2', 'a bag + 2']);
const hp = statusPatch('history', 'm1', 1000);
eq('history purges after 60 days', [hp.status, hp.checkedBy, hp.purgeAt], ['history', 'm1', 1000 + HISTORY_DAYS * 86400000]);
eq('back to active clears checkoff', statusPatch('active', 'm1'), { status: 'active', done: false, checkedBy: null, checkedAt: null, purgeAt: null });
eq('quick-add parsing', [parseEntry('2 milk'), parseEntry('eggs x12'), parseEntry('bread')], [{ name: 'Milk', qty: '2' }, { name: 'Eggs', qty: '12' }, { name: 'Bread', qty: '' }]);


// calendar
eq('week starts Monday', [weekStart('2026-10-28'), weekStart('2026-11-01'), weekStart('2026-11-02')], ['2026-10-26', '2026-10-26', '2026-11-02']);
eq('month grid is whole weeks', [monthGrid('2026-11-15')[0], monthGrid('2026-11-15').length], ['2026-10-26', 42]);
const E = [
  { id: 'shift', title: 'Shift', owner: 'm1', kind: 'work', date: '2026-10-05', endDate: '2026-10-05', start: '09:00', end: '17:00', repeat: 'weekly', skip: ['2026-11-02'] },
  { id: 'trip', title: 'Montreal', owner: 'm2', kind: 'away', date: '2026-11-05', endDate: '2026-11-09', allDay: true, repeat: 'none' },
  { id: 'night', title: 'Night shift', owner: 'm3', kind: 'work', date: '2026-11-03', endDate: '2026-11-04', start: '22:00', end: '06:00', repeat: 'none' },
  { id: 'rent31', title: 'Pay', owner: 'm1', kind: 'appt', date: '2026-08-31', endDate: '2026-08-31', start: '09:00', repeat: 'monthly' },
  { id: 'gym', title: 'Gym', owner: 'm1', kind: 'plans', date: '2026-11-01', endDate: '2026-11-01', start: '07:00', repeat: 'daily', until: '2026-11-03' },
];
const wk = weekDays('2026-11-02');
const occ = occurrences(E, wk[0], wk[6]);
eq('weekly repeat lands on Mondays, skipped date left out', occ.filter((o) => o.ev.id === 'shift').map((o) => o.date), []);
eq('weekly repeat next week', occurrences(E, '2026-11-09', '2026-11-15').filter((o) => o.ev.id === 'shift').map((o) => o.date), ['2026-11-09']);
eq('multi-day trip overlaps week', occ.filter((o) => o.ev.id === 'trip').map((o) => [o.date, o.endDate]), [['2026-11-05', '2026-11-09']]);
eq('daily repeat stops at until', occ.filter((o) => o.ev.id === 'gym').map((o) => o.date), ['2026-11-02', '2026-11-03']);
eq('monthly on the 31st skips short months', occurrences(E, '2026-09-01', '2026-12-31').filter((o) => o.ev.id === 'rent31').map((o) => o.date), ['2026-10-31', '2026-12-31']);
eq('overnight shift shows on both days', ['2026-11-03', '2026-11-04'].map((d) => occ.filter((o) => o.ev.id === 'night' && o.date <= d && o.endDate >= d).length), [1, 1]);
const lane = packLane(occ.filter((o) => o.ev.owner === 'm2'), wk);
eq('trip clipped to the week, spans Thu-Sun', lane.items.map((s) => [s.col, s.span, s.clipStart, s.clipEnd]), [[3, 4, false, true]]);
const p2 = packLane(occurrences([
  { id: 'a', title: 'A', owner: 'x', date: '2026-11-02', endDate: '2026-11-04', allDay: true },
  { id: 'b', title: 'B', owner: 'x', date: '2026-11-03', endDate: '2026-11-03', start: '10:00' },
  { id: 'c', title: 'C', owner: 'x', date: '2026-11-05', endDate: '2026-11-05', start: '10:00' },
], wk[0], wk[6]), wk);
eq('overlaps stack into rows, free space reused', p2.items.map((s) => [s.o.ev.id, s.row]), [['a', 0], ['b', 1], ['c', 0]]);
eq('rows needed', p2.rows, 2);
eq('overnight shift label on each day', ['2026-11-03','2026-11-04'].map((d) => dayTimeLabel(occ.find((o) => o.ev.id === 'night'), d)), ['10p', 'til 6a']);

const rot = { id: 'rot', title: 'Work', owner: 'm1', kind: 'work', date: '2026-11-03', endDate: '2026-11-03', start: '07:00', repeat: 'custom', every: 8, skip: ['2026-11-19'] };
eq('every 8 days', occurrences([rot], '2026-11-01', '2026-12-10').map((o) => o.date), ['2026-11-03', '2026-11-11', '2026-11-27', '2026-12-05']);
eq('every 8 days, window far ahead', occurrences([rot], '2027-03-01', '2027-03-20').map((o) => o.date), ['2027-03-03', '2027-03-11', '2027-03-19']);
eq('every N days text', [repeatText(rot), repeatText({ ...rot, until: '2026-12-31' })], ['Every 8 days', 'Every 8 days, until Dec 31']);
eq('custom repeat needs a day count', normaliseEvent({ title: 'x', date: '2026-11-03', start: '07:00', repeat: 'custom', every: '0', owner: 'm1', kind: 'work' }).ok, false);
eq('custom repeat saved', normaliseEvent({ title: 'x', date: '2026-11-03', start: '07:00', repeat: 'custom', every: '8', owner: 'm1', kind: 'work' }).doc.every, 8);
eq('other repeats store no day count', normaliseEvent({ title: 'x', date: '2026-11-03', start: '07:00', repeat: 'weekly', every: '8', owner: 'm1', kind: 'work' }).doc.every, null);

eq('who is away', awayOn(occ, '2026-11-07'), ['m2']);
eq('time formats', [fmtTime('09:00'), fmtTime('17:30'), fmtTime('00:15'), fmtTimeShort('13:00')], ['9 a.m.', '5:30 p.m.', '12:15 a.m.', '1p']);
eq('end before start is rejected', normaliseEvent({ title: 'x', date: '2026-11-02', endDate: '2026-11-02', start: '22:00', end: '06:00', owner: 'm1', kind: 'work' }).ok, false);
eq('overnight with next-day end is fine', normaliseEvent({ title: 'x', date: '2026-11-02', endDate: '2026-11-03', start: '22:00', end: '06:00', owner: 'm1', kind: 'work' }).ok, true);
eq('all-day clears times', normaliseEvent({ title: 'x', date: '2026-11-02', allDay: true, start: '10:00', owner: 'house', kind: 'party' }).doc.start, '');
const r1 = rentInfo({ rent: { amount: 5000, dueDay: 1 } }, new Date(2026, 9, 28, 10));
eq('rent due on the 1st', [r1.next, r1.daysLeft, r1.label, r1.amountText], ['2026-11-01', 4, 'Due in 4 days', '$5,000']);
eq('rent due today on the 1st', rentInfo({ rent: { amount: 5000, dueDay: 1 } }, new Date(2026, 10, 1, 10)).label, 'Due today');

out.insertAdjacentHTML('afterbegin', `<b id="summary">${fail ? 'FAILED' : 'ALL PASSED'}: ${pass} passed, ${fail} failed</b>\n\n`);
</script>
</body>
</html>
